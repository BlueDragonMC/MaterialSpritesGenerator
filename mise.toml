[settings]
lockfile = true

[env]
MINECRAFT_VERSION = "26.3"
PAPER_VERSION = "26.3.build.147-beta"
MINESTOM_VERSION = "26_3-SNAPSHOT"

[tools]
java = "25"
maven = "3.9"
jq = "latest"

[tasks.atlases]
description = "Download the Minecraft client jar and regenerate the atlas sprite lists"
run = """
mvn -q -f "{{config_root}}/atlas-generator/pom.xml" package
java -jar "{{config_root}}/atlas-generator/target/atlas-generator.jar" "$MINECRAFT_VERSION" "{{config_root}}"
"""

[tasks.mappings]
description = "Run Paper with the built plugin to generate the material sprite data"
depends = ["atlases"]
run = """
mvn -q -f "{{config_root}}/plugin/pom.xml" -Dminecraft.version="$MINECRAFT_VERSION" -Dpaper.version="$PAPER_VERSION" package
bash "{{config_root}}/scripts/run-paper.sh"
"""

[tasks.generate]
description = "Regenerate the atlas sprite lists and the material sprite data"
depends = ["mappings"]

[tasks.test]
description = "Run the module tests"
depends = ["generate"]
run = 'mvn -q -f "{{config_root}}/pom.xml" -Dminecraft.version="$MINECRAFT_VERSION" -Dpaper.version="$PAPER_VERSION" -Dminestom.version="$MINESTOM_VERSION" test'

[tasks.check]
description = "Generate the data and run the module tests"
depends = ["test"]

[tasks.build]
description = "Generate the data and build every module"
depends = ["test"]
run = 'mvn -q -f "{{config_root}}/pom.xml" -Dminecraft.version="$MINECRAFT_VERSION" -Dpaper.version="$PAPER_VERSION" -Dminestom.version="$MINESTOM_VERSION" package'

[tasks.publish]
description = "Generate the data, run the tests and publish every module to the BlueDragon Maven repository"
depends = ["test"]
run = """
VERSION="$(date +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)"
echo "Publishing version $VERSION"
mvn -q -f "{{config_root}}/pom.xml" -Dminecraft.version="$MINECRAFT_VERSION" -Dpaper.version="$PAPER_VERSION" -Dminestom.version="$MINESTOM_VERSION" -Drevision="$VERSION" deploy
"""
