[settings]
lockfile = true

[env]
MINECRAFT_VERSION = "26.3"

[tools]
java = "25"
maven = "3.9"
jq = "latest"

[tasks.atlases]
description = "Download the Minecraft client jar and regenerate the atlas sprite lists and material names"
run = """
mvn -q -f "{{config_root}}/atlas-generator/pom.xml" package
java -jar "{{config_root}}/atlas-generator/target/atlas-generator.jar" "$MINECRAFT_VERSION" "{{config_root}}"
"""

[tasks.mappings]
description = "Run the generator CLI to write the material sprite data"
depends = ["atlases"]
run = """
mvn -q -f "{{config_root}}/generator/pom.xml" package
java -jar "{{config_root}}/generator/target/MaterialSpritesGenerator.jar" "{{config_root}}/data/src/main/resources/material-sprites.json"
"""

[tasks.generate]
description = "Regenerate the atlas sprite lists and the material sprite data"
depends = ["mappings"]

[tasks.test]
description = "Run the module tests"
depends = ["generate"]
run = 'mvn -q -f "{{config_root}}/pom.xml" test'

[tasks.check]
description = "Generate the data and run the module tests"
depends = ["test"]

[tasks.build]
description = "Generate the data and build every module"
depends = ["test"]
run = 'mvn -q -f "{{config_root}}/pom.xml" package'

[tasks.publish]
description = "Generate the data, run the tests and publish every module to the BlueDragon Maven repository"
depends = ["test"]
run = """
VERSION="$(date +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)"
echo "Publishing version $VERSION"
mvn -q -f "{{config_root}}/pom.xml" -Drevision="$VERSION" deploy
"""
